<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Set New Password | Mpumalanga Local Time</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main id="main-content" class="container" style="padding: 40px 0;">
    <section class="card" style="max-width:560px;margin:0 auto;">
      <div class="card-content">
        <h1 class="section-title">Set a new password</h1>
        <p class="section-subtitle">Choose a new password of at least 8 characters.</p>
        <form id="resetPasswordForm" style="display:grid;gap:18px;">
          <label><span>New password</span><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required style="width:100%;padding:14px 16px;border:1px solid #dfe3e8;border-radius:16px;"></label>
          <label><span>Confirm new password</span><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required style="width:100%;padding:14px 16px;border:1px solid #dfe3e8;border-radius:16px;"></label>
          <button class="btn primary" type="submit">Reset password</button>
        </form>
        <p id="resetPasswordMessage" class="meta" role="status" aria-live="polite" style="margin-top:16px;"></p>
      </div>
    </section>
  </main>
  <script>
    const token = new URLSearchParams(window.location.search).get('token') || '';
    const form = document.getElementById('resetPasswordForm');
    const message = document.getElementById('resetPasswordMessage');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      if (password !== confirmPassword) {
        message.textContent = 'Passwords do not match.';
        return;
      }
      message.textContent = 'Saving...';
      try {
        const response = await fetch('/api/password-reset/complete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password, confirmPassword }),
        });
        const data = await response.json();
        if (response.ok) {
          message.textContent = 'Password reset successful! Redirecting you to login...';
          form.querySelector('button').disabled = true;
          window.setTimeout(() => {
            window.location.href = '/login.html';
          }, 2000);
          return;
        }
        message.textContent = data.message || data.error || 'Please try again later.';
      } catch (error) {
        message.textContent = 'Unable to reach the server. Please try again later.';
      }
    });
  </script>
  <div id="cookie-consent-root"></div>
  <script src="/cookie-consent.js" defer></script>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      if (window.CookieConsent) window.CookieConsent.init({ companyName: 'Mpumalanga Local Time', policyUrl: '/privacy-policy.html' });
    });
  </script>
  <div style="margin-top:28px"><!--#include virtual="/footer.html"--></div>
</body>
</html>
