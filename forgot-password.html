<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Forgot Password | Mpumalanga Local Time</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main id="main-content" class="container" style="padding: 40px 0;">
    <section class="card" style="max-width:560px;margin:0 auto;">
      <div class="card-content">
        <h1 class="section-title">Reset your password</h1>
        <p class="section-subtitle">Enter your registered email address and we’ll send you a secure reset link.</p>
        <form id="forgotPasswordForm" style="display:grid;gap:18px;">
          <label>
            <span>Email address</span>
            <input id="resetEmail" name="email" type="email" autocomplete="email" required style="width:100%;padding:14px 16px;border:1px solid #dfe3e8;border-radius:16px;">
          </label>
          <button class="btn primary" type="submit">Send reset link</button>
        </form>
        <p id="forgotPasswordMessage" class="meta" role="status" aria-live="polite" style="margin-top:16px;"></p>
        <p style="margin-top:18px;"><a href="/login.html">Back to login</a></p>
      </div>
    </section>
  </main>
  <script>
    const form = document.getElementById('forgotPasswordForm');
    const message = document.getElementById('forgotPasswordMessage');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = 'Sending...';
      try {
        const response = await fetch('/api/password-reset/request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('resetEmail').value }),
        });
        const data = await response.json();
        message.textContent = data.message || data.error || 'Please try again later.';
      } catch (error) {
        message.textContent = 'Unable to reach the server. Please try again later.';
      }
    });
  </script>
  <div id="cookie-consent-root"></div>
  <script src="/cookie-consent.js" defer></script>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      if (window.CookieConsent) window.CookieConsent.init({ companyName: 'Mpumalanga Local Time', policyUrl: '/privacy-policy.html' });
    });
  </script>
  <div style="margin-top:28px"><!--#include virtual="/footer.html"--></div>
</body>
</html>
