<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Newsroom Dashboard | Mpumalanga Local Time</title>
  <meta name="description" content="Newsroom dashboard for managing drafts, review, publishing and archived newsroom content." />
  <link rel="canonical" href="https://mplocaltime.co.za/dashboard.html" />
  <link rel="stylesheet" href="/styles.css" />
  <script defer src="/main.js"></script>
  <style>
    body { background: #f5f1ea; }
    .newsroom-shell { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 24px; padding: 32px 0 60px; }
    .newsroom-sidebar { position: sticky; top: 24px; align-self: start; }
    .newsroom-nav { display: grid; gap: 10px; }
    .newsroom-nav a { display: block; padding: 10px 12px; border-radius: 12px; text-decoration: none; color: #1f2933; background: #fff; border: 1px solid #e5e7eb; }
    .newsroom-nav a:hover, .newsroom-nav a:focus-visible { background: #f3f4f6; }
    .dashboard-hero { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
    .eyebrow { letter-spacing: .08em; text-transform: uppercase; font-size: .72rem; color: #7a5a2d; font-weight: 700; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin: 22px 0; }
    .stat-card { display: block; text-decoration: none; color: inherit; background: #fff; border: 1px solid #e5e7eb; border-radius: 18px; padding: 16px; box-shadow: 0 10px 24px rgba(17, 24, 39, 0.04); }
    .stat-card strong { font-size: 1.7rem; display: block; margin-bottom: 8px; }
    .stat-card span { color: #4b5563; }
    .panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 22px; padding: 20px; box-shadow: 0 18px 34px rgba(17, 24, 39, 0.04); }
    .panel + .panel { margin-top: 22px; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .queue-list { display: grid; gap: 12px; }
    .story-item { border: 1px solid #e7e5e4; border-radius: 16px; padding: 14px; background: #fffaf5; }
    .story-item-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
    .story-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; padding: 10px 16px; border: 1px solid #d1d5db; background: #fff; color: #111827; font-weight: 600; cursor: pointer; }
    .btn.primary { background: #b71c1c; color: white; border-color: #b71c1c; }
    .btn.secondary { background: #1f2937; color: white; border-color: #1f2937; }
    .btn.small { padding: 8px 12px; font-size: .86rem; }
    .pill { display: inline-block; padding: 4px 10px; border-radius: 999px; background: #f3f4f6; color: #374151; font-size: .75rem; font-weight: 700; }
    .field-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    label { display: grid; gap: 8px; font-weight: 600; color: #374151; }
    input, textarea, select { width: 100%; border: 1px solid #d1d5db; border-radius: 12px; padding: 11px 12px; font: inherit; color: #111827; background: #fff; }
    textarea { min-height: 120px; resize: vertical; }
    .status-banner { border-radius: 12px; padding: 10px 12px; background: #fff7ed; border: 1px solid #fed7aa; color: #9a4b00; }
    .muted { color: #6b7280; }
    @media (max-width: 900px) {
      .newsroom-shell { grid-template-columns: 1fr; }
      .newsroom-sidebar { position: static; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container navbar">
      <div class="site-branding">
        <a href="/" aria-label="Mpumalanga Local Time home">
          <div style="display:flex;align-items:center;gap:12px;">
            <img src="/logo.png" alt="Mpumalanga Local Time logo" />
            <div>
              <strong class="site-title">Mpumalanga Local Time</strong>
              <span class="site-tagline">Newsroom dashboard</span>
            </div>
          </div>
        </a>
      </div>
    </div>
  </header>

  <main class="container newsroom-shell">
    <aside class="newsroom-sidebar">
      <div class="panel">
        <h2 style="margin-top:0;">Newsroom</h2>
        <nav class="newsroom-nav" id="newsroomNav" aria-label="Newsroom navigation"></nav>
      </div>
    </aside>

    <section style="min-width:0;">
      <div class="dashboard-hero">
        <div>
          <div class="eyebrow">MLT newsroom</div>
          <h1 style="margin:0;">Dashboard</h1>
          <div id="welcome" class="muted">Loading profile…</div>
        </div>
        <button id="logoutButton" class="btn secondary" type="button">Logout</button>
      </div>

      <div id="statusBanner" class="status-banner" aria-live="polite" style="display:none; margin-top:16px;"></div>

      <div id="summaryGrid" class="stat-grid" aria-live="polite"></div>

      <section class="panel" id="create-story-panel">
        <div class="panel-header">
          <h2 style="margin:0;">Create Article</h2>
        </div>

        <form id="storyForm">
          <div class="field-row">
            <label>
              Headline
              <input name="title" type="text" required placeholder="Story headline" />
            </label>
            <label>
              Category
              <select name="category">
                <option value="News">News</option>
                <option value="Community">Community</option>
                <option value="Business">Business</option>
                <option value="Arts">Arts</option>
                <option value="Sports">Sports</option>
                <option value="Health">Health</option>
                <option value="Education">Education</option>
              </select>
            </label>
          </div>

          <div class="field-row" style="margin-top:12px;">
            <label>
              Slug
              <input name="slug" type="text" placeholder="story-slug" />
            </label>
            <label>
              Excerpt
              <input name="excerpt" type="text" maxlength="260" placeholder="Short summary" />
            </label>
          </div>

          <div style="margin-top:12px;">
            <label>
              Story body
              <textarea name="content" required placeholder="Write the article body here."></textarea>
            </label>
          </div>

          <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;">
            <button class="btn primary" type="submit">Save draft</button>
            <button class="btn secondary" type="button" id="saveAndSubmitButton">Save and submit</button>
          </div>
        </form>
      </section>

      <section class="panel" id="media-library-panel">
        <div class="panel-header">
          <h2 style="margin:0;">Media Library</h2>
        </div>
        <div class="field-row">
          <label>
            Featured image URL
            <input id="featuredImageUrl" name="featured_image" type="url" placeholder="/uploads/news/..." />
          </label>
          <label>
            Alt text
            <input id="featuredImageAlt" name="image_alt" type="text" maxlength="255" placeholder="Descriptive alt text" />
          </label>
        </div>
        <div class="field-row" style="margin-top:12px;">
          <label>
            Caption
            <input id="featuredImageCaption" name="image_caption" type="text" maxlength="255" placeholder="Optional caption" />
          </label>
          <label>
            Photo credit
            <input id="featuredImageCredit" name="image_credit" type="text" maxlength="255" placeholder="Optional credit" />
          </label>
        </div>
        <div style="margin-top:12px; display:grid; gap:12px;">
          <div class="field-row">
            <label>
              Search media
              <input id="mediaSearch" type="search" placeholder="Filter by filename, alt text or caption" />
            </label>
          </div>
          <div class="field-row">
            <label>
              Upload new image
              <input id="featuredMediaUpload" type="file" accept="image/jpeg,image/png,image/webp" />
            </label>
            <div style="display:flex; align-items:end;">
              <button class="btn secondary" type="button" id="uploadFeaturedMediaButton">Upload image</button>
            </div>
          </div>
          <div id="mediaLibraryPicker" class="field-row" aria-live="polite"></div>
          <div id="mediaLibraryStatus" class="muted">No media uploaded yet.</div>
          <div class="panel-header" id="mediaPagination" style="margin-top:8px; display:none;">
            <button id="mediaPrevPage" class="btn small" type="button">Previous</button>
            <span id="mediaPageSummary" class="muted">Page 1</span>
            <button id="mediaNextPage" class="btn small" type="button">Next</button>
          </div>
        </div>
      </section>

      <section class="panel" id="content-manager">
        <div class="panel-header">
          <h2 style="margin:0;">Content Manager</h2>
        </div>

        <div class="field-row" style="margin-bottom: 12px;">
          <label>
            Search
            <input id="storySearch" type="search" placeholder="Headline, slug, author, tag" />
          </label>
          <label>
            Status
            <select id="statusFilter">
              <option value="">All statuses</option>
              <option value="draft">Draft</option>
              <option value="submitted">Submitted</option>
              <option value="in_review">In review</option>
              <option value="changes_requested">Changes requested</option>
              <option value="approved">Approved</option>
              <option value="scheduled">Scheduled</option>
              <option value="published">Published</option>
              <option value="archived">Archived</option>
            </select>
          </label>
          <label>
            Category
            <select id="categoryFilter">
              <option value="">All categories</option>
              <option value="News">News</option>
              <option value="Community">Community</option>
              <option value="Business">Business</option>
              <option value="Arts">Arts</option>
              <option value="Sports">Sports</option>
              <option value="Health">Health</option>
              <option value="Education">Education</option>
            </select>
          </label>
        </div>

        <div id="storyList" class="queue-list" aria-live="polite"></div>
        <div class="panel-header" id="storyPagination" style="margin-top:16px; display:none;">
          <button id="storyPrevPage" class="btn small" type="button">Previous</button>
          <span id="storyPageSummary" class="muted">Page 1</span>
          <button id="storyNextPage" class="btn small" type="button">Next</button>
        </div>
      </section>

      <section class="panel" id="review-queue-panel">
        <div class="panel-header">
          <h2 style="margin:0;">Editorial Review Queue</h2>
        </div>
        <div id="reviewQueue" class="queue-list" aria-live="polite"></div>
      </section>
    </section>
  </main>

  <script>
    const token = localStorage.getItem('token');
    const storedUser = localStorage.getItem('currentUser');
    let currentRole = 'user';
    let currentUserId = null;
    let storyPage = 1;
    let storyPageTotal = 0;
    const storyPagination = document.getElementById('storyPagination');
    const storyPrevPageButton = document.getElementById('storyPrevPage');
    const storyNextPageButton = document.getElementById('storyNextPage');
    const storyPageSummary = document.getElementById('storyPageSummary');
    const statusBanner = document.getElementById('statusBanner');
    const summaryGrid = document.getElementById('summaryGrid');
    const storyList = document.getElementById('storyList');
    const reviewQueue = document.getElementById('reviewQueue');
    const storyForm = document.getElementById('storyForm');
    const saveAndSubmitButton = document.getElementById('saveAndSubmitButton');
    const logoutButton = document.getElementById('logoutButton');
    const newsroomNav = document.getElementById('newsroomNav');
    const welcome = document.getElementById('welcome');
    const statusFilter = document.getElementById('statusFilter');
    const categoryFilter = document.getElementById('categoryFilter');
    const storySearch = document.getElementById('storySearch');
    const featuredImageUrlInput = document.getElementById('featuredImageUrl');
    const featuredImageAltInput = document.getElementById('featuredImageAlt');
    const featuredImageCaptionInput = document.getElementById('featuredImageCaption');
    const featuredImageCreditInput = document.getElementById('featuredImageCredit');
    const mediaLibraryPicker = document.getElementById('mediaLibraryPicker');
    const mediaLibraryStatus = document.getElementById('mediaLibraryStatus');
    const mediaSearchInput = document.getElementById('mediaSearch');
    const mediaPrevPageButton = document.getElementById('mediaPrevPage');
    const mediaNextPageButton = document.getElementById('mediaNextPage');
    const mediaPageSummary = document.getElementById('mediaPageSummary');
    const mediaPagination = document.getElementById('mediaPagination');
    const featuredMediaUploadInput = document.getElementById('featuredMediaUpload');
    const uploadFeaturedMediaButton = document.getElementById('uploadFeaturedMediaButton');
    let mediaPage = 1;
    let mediaPageTotal = 0;

    function escapeHtml(value = '') {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function statusGroup(status = 'draft') {
      const normalized = String(status || 'draft').trim().toLowerCase().replace(/\s+/g, '_');
      const canonical = {
        draft: 'draft',
        submitted: 'submitted',
        'pending-review': 'submitted',
        pending_review: 'submitted',
        'in-review': 'in_review',
        in_review: 'in_review',
        'changes-requested': 'changes_requested',
        changes_requested: 'changes_requested',
        'needs-changes': 'changes_requested',
        needs_changes: 'changes_requested',
        approved: 'approved',
        scheduled: 'scheduled',
        published: 'published',
        archived: 'archived',
      }[normalized] || normalized;
      return canonical === 'pending-review' ? 'submitted' : canonical;
    }

    function formatZuluDate(value) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      return date.toLocaleString('en-ZA', { dateStyle: 'medium', timeStyle: 'short', timeZone: 'Africa/Johannesburg' });
    }

    function setBanner(message, tone = 'info') {
      statusBanner.style.display = 'block';
      statusBanner.textContent = message;
      statusBanner.style.background = tone === 'error' ? '#fff1f2' : tone === 'success' ? '#ecfdf5' : '#fff7ed';
      statusBanner.style.borderColor = tone === 'error' ? '#fecdd3' : tone === 'success' ? '#a7f3d0' : '#fed7aa';
      statusBanner.style.color = tone === 'error' ? '#9f1239' : tone === 'success' ? '#065f46' : '#9a4b00';
    }

    function displayAuthRequired() {
      welcome.textContent = 'Please sign in to access the newsroom dashboard.';
      summaryGrid.innerHTML = '<div class="panel"><p>Please log in through <a href="/login.html">login</a> to view newsroom data.</p></div>';
      storyList.innerHTML = '<p>Please sign in to review your stories.</p>';
      reviewQueue.innerHTML = '<p>Editorial queue is available to editors and admins after sign in.</p>';
      storyForm.querySelectorAll('input, textarea, select, button').forEach((element) => { element.disabled = true; });
      saveAndSubmitButton.disabled = true;
      newsroomNav.innerHTML = '<a href="/login.html">Sign in</a>';
    }

    function handleLogout() {
      localStorage.removeItem('token');
      localStorage.removeItem('currentUser');
      localStorage.removeItem('currentRole');
      window.location.href = '/login.html';
    }

    async function fetchJson(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: {
          ...(options.headers || {}),
          ...(token ? { Authorization: `Bearer ${token}` } : {}),
        },
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(payload.error || 'Request failed');
      }
      return payload;
    }

    function buildNav(role) {
      const statusMap = {
        'Dashboard': '',
        'Create Article': '',
        'All Articles': '',
        'My Drafts': 'draft',
        'Submitted': 'submitted',
        'Changes Requested': 'changes_requested',
        'Approved': 'approved',
        'Scheduled': 'scheduled',
        'Published': 'published',
        'Archived': 'archived',
        'Review Queue': 'in_review',
        'Breaking News': 'published',
        'Featured Stories': 'published',
      };
      const baseNav = [
        ['Dashboard', '#create-story-panel'],
        ['Create Article', '#create-story-panel'],
        ['Media Library', '#media-library-panel'],
        ['All Articles', '#content-manager'],
        ['My Drafts', '#content-manager'],
        ['Submitted', '#content-manager'],
        ['Changes Requested', '#content-manager'],
        ['Approved', '#content-manager'],
        ['Scheduled', '#content-manager'],
        ['Published', '#content-manager'],
        ['Archived', '#content-manager'],
      ];
      const editorNav = [
        ['Review Queue', '#review-queue-panel'],
        ['Breaking News', '#review-queue-panel'],
        ['Featured Stories', '#review-queue-panel'],
      ];
      const items = role === 'admin' || role === 'editor' ? [...baseNav, ...editorNav] : baseNav;
      newsroomNav.innerHTML = items.map(([label, href]) => `<a href="${href}" data-status-filter="${escapeHtml(statusMap[label] || '')}">${escapeHtml(label)}</a>`).join('');
    }

    function renderSummaryCards(payload) {
      const overview = payload.overview || {};
      const cards = [
        { label: 'My Drafts', value: overview.drafts ?? 0, status: 'draft' },
        { label: 'Submitted', value: overview.submitted ?? 0, status: 'submitted' },
        { label: 'In Review', value: overview.inReview ?? 0, status: 'in_review' },
        { label: 'Changes Requested', value: overview.changesRequested ?? 0, status: 'changes_requested' },
        { label: 'Approved', value: overview.approved ?? 0, status: 'approved' },
        { label: 'Scheduled', value: overview.scheduled ?? 0, status: 'scheduled' },
        { label: 'Published', value: overview.published ?? 0, status: 'published' },
        { label: 'Archived', value: overview.archived ?? 0, status: 'archived' },
      ];
      const newsroom = overview.newsroom || null;
      if (newsroom) {
        cards.push({ label: 'Newsroom Total', value: Object.values(newsroom).reduce((sum, value) => sum + Number(value || 0), 0), status: '' });
      }
      summaryGrid.innerHTML = cards.map((card) => `
        <button class="stat-card" type="button" data-status-filter="${escapeHtml(card.status || '')}" aria-label="Filter by ${escapeHtml(card.label)}">
          <strong>${Number(card.value || 0)}</strong>
          <span>${escapeHtml(card.label)}</span>
        </button>
      `).join('');
    }

    function renderStoryRow(story) {
      const canonicalStatus = statusGroup(story.status);
      const isEditorial = ['admin', 'editor'].includes(currentRole);
      const isOwner = Number(story.author_id) === Number(currentUserId);
      const canEdit = (isOwner && ['draft', 'changes_requested'].includes(canonicalStatus)) || isEditorial;
      const actionButtons = [];

      if ((isEditorial && canonicalStatus !== 'archived') || (canEdit && ['draft', 'changes_requested'].includes(canonicalStatus))) {
        actionButtons.push(`<button class="btn small" type="button" data-action="edit" data-id="${story.id}">Edit</button>`);
      }

      if (canonicalStatus === 'draft' && canEdit) {
        actionButtons.push(`<button class="btn small primary" type="button" data-action="submit" data-id="${story.id}">Submit for review</button>`);
      }

      if (canonicalStatus === 'changes_requested' && canEdit) {
        actionButtons.push(`<button class="btn small primary" type="button" data-action="submit" data-id="${story.id}">Resubmit</button>`);
      }

      if (['submitted', 'in_review'].includes(canonicalStatus) && isEditorial) {
        actionButtons.push(`<button class="btn small primary" type="button" data-action="begin-review" data-id="${story.id}">Begin review</button>`);
        actionButtons.push(`<button class="btn small" type="button" data-action="request-changes" data-id="${story.id}">Request changes</button>`);
      }

      if (canonicalStatus === 'in_review' && isEditorial) {
        actionButtons.push(`<button class="btn small primary" type="button" data-action="approve" data-id="${story.id}">Approve</button>`);
        actionButtons.push(`<button class="btn small" type="button" data-action="request-changes" data-id="${story.id}">Request changes</button>`);
      }

      if (canonicalStatus === 'approved' && isEditorial) {
        actionButtons.push(`<button class="btn small" type="button" data-action="schedule" data-id="${story.id}">Schedule</button>`);
        actionButtons.push(`<button class="btn small secondary" type="button" data-action="publish" data-id="${story.id}">Publish now</button>`);
      }

      if (canonicalStatus === 'scheduled' && isEditorial) {
        actionButtons.push(`<button class="btn small secondary" type="button" data-action="publish" data-id="${story.id}">Publish now</button>`);
      }

      if (canonicalStatus === 'published') {
        const storySlug = story.slug || story.id;
        actionButtons.push(`<a class="btn small" href="/story/${escapeHtml(storySlug)}" target="_blank" rel="noopener">View live article</a>`);
        if (isEditorial) {
          actionButtons.push(`<button class="btn small" type="button" data-action="archive" data-id="${story.id}">Archive</button>`);
          actionButtons.push(`<button class="btn small" type="button" data-action="toggle-breaking" data-id="${story.id}" data-breaking="${story.is_breaking ? '0' : '1'}">${story.is_breaking ? 'Remove breaking' : 'Mark breaking'}</button>`);
          actionButtons.push(`<button class="btn small" type="button" data-action="toggle-featured" data-id="${story.id}" data-featured="${story.featured ? '0' : '1'}">${story.featured ? 'Remove featured' : 'Mark featured'}</button>`);
        }
      }

      const scheduledAt = story.scheduled_at ? ` <span class="muted">Scheduled: ${escapeHtml(formatZuluDate(story.scheduled_at))}</span>` : '';
      const statusValue = escapeHtml(story.status || 'draft');
      return `
        <article class="story-item">
          <div class="story-item-head">
            <div>
              <strong>${escapeHtml(story.title || 'Untitled story')}</strong>
              <div class="muted">${escapeHtml(story.category || 'News')} • ${escapeHtml(story.author || 'Unknown author')} • ${statusValue}</div>
              ${scheduledAt}
            </div>
            <span class="pill">${statusValue}</span>
          </div>
          <p class="muted" style="margin:10px 0 0;">${escapeHtml((story.excerpt || story.content || '').slice(0, 170) || 'No excerpt provided yet.')}${((story.excerpt || story.content || '').length > 170) ? '…' : ''}</p>
          <div class="story-actions">
            ${actionButtons.join('')}
          </div>
        </article>
      `;
    }

    function renderPagination(total, page, limit) {
      const totalPages = Math.max(1, Math.ceil(total / limit));
      storyPageSummary.textContent = `Page ${page} of ${totalPages}`;
      storyPrevPageButton.disabled = page <= 1;
      storyNextPageButton.disabled = page >= totalPages || total <= limit;
      storyPagination.style.display = total > limit ? 'flex' : 'none';
    }

    function renderMediaPagination(total, page, limit) {
      const totalPages = Math.max(1, Math.ceil(total / limit));
      mediaPageSummary.textContent = `Page ${page} of ${totalPages}`;
      mediaPrevPageButton.disabled = page <= 1;
      mediaNextPageButton.disabled = page >= totalPages || total <= limit;
      mediaPagination.style.display = total > limit ? 'flex' : 'none';
    }

    async function loadMediaLibrary(page = 1, search = '') {
      try {
        const params = new URLSearchParams({ page: String(page), limit: '6' });
        if (search) params.set('q', search);
        const payload = await fetchJson(`/api/media?${params.toString()}`);
        const items = Array.isArray(payload.media) ? payload.media : [];
        mediaPageTotal = Number(payload.total || 0);

        if (!items.length) {
          mediaLibraryPicker.innerHTML = search
            ? '<div class="muted">No media matched your current search.</div>'
            : '<div class="muted">No media uploaded yet.</div>';
          mediaLibraryStatus.textContent = search ? 'No search results found.' : 'No media uploaded yet.';
          renderMediaPagination(0, page, 6);
          return;
        }

        const cards = items.map((item) => {
          const imageUrl = item.public_url || item.url || '/logo.png';
          const altText = item.alt_text || item.original_name || 'Newsroom asset';
          return `
            <article class="story-item" style="min-width:0;">
              <img src="${escapeHtml(imageUrl)}" alt="${escapeHtml(altText)}" style="width:100%;height:150px;object-fit:cover;border-radius:12px;display:block;margin-bottom:10px;" onerror="this.src='/logo.png'" />
              <div><strong>${escapeHtml(item.original_name || 'Untitled asset')}</strong></div>
              <div class="muted">${escapeHtml(item.caption || 'No caption')}</div>
              <div class="muted">${escapeHtml(item.credit || 'No credit')}</div>
              <div class="muted">${escapeHtml(item.size_bytes ? `${Math.round(item.size_bytes / 1024)} KB` : 'Unknown size')} • ${escapeHtml(formatZuluDate(item.createdAt || item.created_at))}</div>
              <div class="story-actions" style="margin-top:10px;">
                <button class="btn small primary" type="button" data-media-action="select" data-media-id="${item.id}">Select image</button>
                <button class="btn small" type="button" data-media-action="edit" data-media-id="${item.id}">Edit metadata</button>
              </div>
            </article>
          `;
        }).join('');

        mediaLibraryPicker.innerHTML = cards;
        mediaLibraryStatus.textContent = `Loaded ${items.length} image${items.length === 1 ? '' : 's'} from the local library.`;
        renderMediaPagination(mediaPageTotal, page, 6);
      } catch (error) {
        mediaLibraryStatus.textContent = error.message || 'Unable to load media library.';
        mediaLibraryPicker.innerHTML = '<div class="muted">Unable to load the media library.</div>';
        renderMediaPagination(0, page, 6);
      }
    }

    async function loadDashboard() {
      try {
        const response = await fetchJson('/api/dashboard/overview');
        const role = response.role || currentRole || 'user';
        currentRole = role;
        localStorage.setItem('currentRole', role);
        renderSummaryCards(response);
        buildNav(role);
        welcome.textContent = `Logged in as ${escapeHtml(storedUser || 'User')} (${escapeHtml(role)})`;
      } catch (error) {
        summaryGrid.innerHTML = '<div class="panel"><p>Unable to load newsroom overview.</p></div>';
        welcome.textContent = 'Unable to load current user';
      }

      try {
        const filters = new URLSearchParams();
        const searchTerm = storySearch.value.trim();
        const selectedStatus = statusFilter.value;
        const selectedCategory = categoryFilter.value;
        if (searchTerm) filters.set('q', searchTerm);
        if (selectedStatus) filters.set('status', selectedStatus);
        if (selectedCategory) filters.set('category', selectedCategory);
        filters.set('limit', '10');
        filters.set('page', String(storyPage));
        const storyPayload = await fetchJson(`/api/stories?${filters.toString()}`);
        const stories = Array.isArray(storyPayload.stories) ? storyPayload.stories : [];
        storyPageTotal = Number(storyPayload.total || 0);
        if (!stories.length) {
          storyList.innerHTML = '<p>No stories match the current newsroom filters.</p>';
        } else {
          storyList.innerHTML = stories.map(renderStoryRow).join('');
        }
        renderPagination(Number(storyPayload.total || 0), storyPage, 10);
      } catch (error) {
        storyList.innerHTML = `<p>${escapeHtml(error.message || 'Unable to load story content.')}</p>`;
        storyPagination.style.display = 'none';
      }

      try {
        const reviewPayload = await fetchJson('/api/stories?status=submitted,in_review,changes_requested,approved&limit=8&page=1');
        const reviewStories = Array.isArray(reviewPayload.stories) ? reviewPayload.stories : [];
        if (!reviewStories.length) {
          reviewQueue.innerHTML = '<p>No stories are awaiting editorial review.</p>';
        } else {
          reviewQueue.innerHTML = reviewStories.map((story) => {
            const queueStatus = statusGroup(story.status);
            const actions = [];
            if (['submitted', 'in_review'].includes(queueStatus) && ['admin', 'editor'].includes(currentRole)) {
              actions.push(`<button class="btn small primary" type="button" data-action="begin-review" data-id="${story.id}">Begin review</button>`);
              actions.push(`<button class="btn small" type="button" data-action="request-changes" data-id="${story.id}">Request changes</button>`);
            }
            if (queueStatus === 'approved' && ['admin', 'editor'].includes(currentRole)) {
              actions.push(`<button class="btn small secondary" type="button" data-action="publish" data-id="${story.id}">Publish</button>`);
            }
            return `
              <article class="story-item">
                <div class="story-item-head">
                  <div>
                    <strong>${escapeHtml(story.title || 'Untitled story')}</strong>
                    <div class="muted">${escapeHtml(story.category || 'News')} • ${escapeHtml(story.author || 'Unknown author')} • ${escapeHtml(story.status || 'draft')}</div>
                  </div>
                  <span class="pill">${escapeHtml(story.status || 'draft')}</span>
                </div>
                <div class="story-actions">
                  ${actions.join('') || '<span class="muted">No editorial action available.</span>'}
                </div>
              </article>
            `;
          }).join('');
        }
      } catch (error) {
        reviewQueue.innerHTML = `<p>${escapeHtml(error.message || 'Unable to load dashboard review queue.')}</p>`;
      }
    }

    function populateStoryForm(story) {
      storyForm.dataset.storyId = String(story.id);
      storyForm.dataset.storyStatus = story.status || 'draft';
      storyForm.elements.title.value = story.title || '';
      storyForm.elements.category.value = story.category || 'News';
      storyForm.elements.slug.value = story.slug || '';
      storyForm.elements.excerpt.value = story.excerpt || '';
      storyForm.elements.content.value = story.content || '';
      const submitButtonLabel = storyForm.querySelector('button[type="submit"]');
      if (submitButtonLabel) {
        submitButtonLabel.textContent = story.status === 'published' ? 'Update article' : 'Update draft';
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    mediaSearchInput.addEventListener('input', () => {
      mediaPage = 1;
      loadMediaLibrary(mediaPage, mediaSearchInput.value.trim());
    });

    mediaPrevPageButton.addEventListener('click', () => {
      if (mediaPage > 1) {
        mediaPage -= 1;
        loadMediaLibrary(mediaPage, mediaSearchInput.value.trim());
      }
    });

    mediaNextPageButton.addEventListener('click', () => {
      if (mediaPageTotal > mediaPage * 6) {
        mediaPage += 1;
        loadMediaLibrary(mediaPage, mediaSearchInput.value.trim());
      }
    });

    uploadFeaturedMediaButton.addEventListener('click', async () => {
      const file = featuredMediaUploadInput.files && featuredMediaUploadInput.files[0];
      if (!file) {
        setBanner('Choose an image before uploading it to the library.', 'error');
        return;
      }

      const formData = new FormData();
      formData.append('file', file);
      formData.append('caption', featuredImageCaptionInput.value.trim());
      formData.append('alt_text', featuredImageAltInput.value.trim());
      formData.append('credit', featuredImageCreditInput.value.trim());

      try {
        const response = await fetchJson('/api/media/upload', {
          method: 'POST',
          body: formData,
        });
        const media = response.media || {};
        featuredImageUrlInput.value = media.public_url || media.url || '';
        featuredImageAltInput.value = media.alt_text || featuredImageAltInput.value || '';
        featuredImageCaptionInput.value = media.caption || featuredImageCaptionInput.value || '';
        featuredImageCreditInput.value = media.credit || featuredImageCreditInput.value || '';
        setBanner(`Uploaded ${media.original_name || 'image'} successfully.`, 'success');
        featuredMediaUploadInput.value = '';
        await loadMediaLibrary(mediaPage, mediaSearchInput.value.trim());
      } catch (error) {
        setBanner(error.message || 'Image upload failed.', 'error');
      }
    });

    storySearch.addEventListener('input', () => {
      storyPage = 1;
      loadDashboard();
    });
    statusFilter.addEventListener('change', () => {
      storyPage = 1;
      loadDashboard();
    });
    categoryFilter.addEventListener('change', () => {
      storyPage = 1;
      loadDashboard();
    });

    storyPrevPageButton.addEventListener('click', () => {
      if (storyPage > 1) {
        storyPage -= 1;
        loadDashboard();
      }
    });

    storyNextPageButton.addEventListener('click', () => {
      if (storyPageTotal > storyPage * 10) {
        storyPage += 1;
        loadDashboard();
      }
    });

    storyForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const formData = new FormData(storyForm);
      const payload = {
        title: formData.get('title'),
        category: formData.get('category') || 'News',
        slug: formData.get('slug'),
        excerpt: formData.get('excerpt'),
        content: formData.get('content'),
        status: 'draft',
      };
      try {
        if (storyForm.dataset.storyId) {
          const response = await fetchJson(`/api/stories/${storyForm.dataset.storyId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ...payload, status: storyForm.dataset.storyStatus || 'draft' }),
          });
          setBanner(`Article updated: ${response.story?.title || 'story'}.`, 'success');
        } else {
          const response = await fetchJson('/api/stories', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          setBanner(`Article saved as a draft: ${response.story?.title || 'story'}.`, 'success');
        }
        storyForm.reset();
        delete storyForm.dataset.storyId;
        delete storyForm.dataset.storyStatus;
        const submitButtonLabel = storyForm.querySelector('button[type="submit"]');
        if (submitButtonLabel) {
          submitButtonLabel.textContent = 'Save draft';
        }
        await loadDashboard();
      } catch (error) {
        setBanner(error.message || 'Unable to save story.', 'error');
      }
    });

    saveAndSubmitButton.addEventListener('click', async () => {
      const formData = new FormData(storyForm);
      const payload = {
        title: formData.get('title'),
        category: formData.get('category') || 'News',
        slug: formData.get('slug'),
        excerpt: formData.get('excerpt'),
        content: formData.get('content'),
        status: 'draft',
      };
      try {
        let storyId = storyForm.dataset.storyId;
        let created;
        if (storyId) {
          created = await fetchJson(`/api/stories/${storyId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ...payload, status: 'draft' }),
          });
        } else {
          created = await fetchJson('/api/stories', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          storyId = created.story.id;
        }
        const result = await fetchJson(`/api/stories/${storyId}/submit`, { method: 'POST' });
        setBanner(`Submitted for review: ${result.story?.title || 'story'}.`, 'success');
        storyForm.reset();
        delete storyForm.dataset.storyId;
        const submitButtonLabel = storyForm.querySelector('button[type="submit"]');
        if (submitButtonLabel) {
          submitButtonLabel.textContent = 'Save draft';
        }
        await loadDashboard();
      } catch (error) {
        setBanner(error.message || 'Unable to submit story for review.', 'error');
      }
    });

    document.addEventListener('click', async (event) => {
      const statusCard = event.target.closest('[data-status-filter]');
      if (statusCard && statusCard.dataset.statusFilter !== undefined) {
        if (statusCard.dataset.statusFilter) {
          statusFilter.value = statusCard.dataset.statusFilter;
        } else {
          statusFilter.value = '';
        }
        storyPage = 1;
        loadDashboard();
        document.getElementById('content-manager').scrollIntoView({ behavior: 'smooth', block: 'start' });
        return;
      }

      const mediaButton = event.target.closest('[data-media-action]');
      if (mediaButton) {
        const mediaAction = mediaButton.dataset.mediaAction;
        const mediaId = mediaButton.dataset.mediaId;
        if (mediaAction === 'select') {
          const item = (mediaLibraryPicker.querySelectorAll('[data-media-id]') || []).length ? null : null;
          if (!mediaId) return;
          try {
            const payload = await fetchJson(`/api/media/${mediaId}`);
            const media = payload.media || {};
            const nextUrl = media.public_url || media.url || '';
            featuredImageUrlInput.value = nextUrl;
            featuredImageAltInput.value = media.alt_text || '';
            featuredImageCaptionInput.value = media.caption || '';
            featuredImageCreditInput.value = media.credit || '';
            setBanner(`Selected ${media.original_name || 'image'} for this story.`, 'success');
          } catch (error) {
            setBanner(error.message || 'Unable to select that media item.', 'error');
          }
          return;
        }
        if (mediaAction === 'edit') {
          if (!mediaId) return;
          try {
            const payload = await fetchJson(`/api/media/${mediaId}`);
            const media = payload.media || {};
            const nextAlt = window.prompt('Alt text', media.alt_text || '');
            if (nextAlt === null) return;
            const nextCaption = window.prompt('Caption', media.caption || '');
            if (nextCaption === null) return;
            const nextCredit = window.prompt('Photo credit', media.credit || '');
            if (nextCredit === null) return;
            const updated = await fetchJson(`/api/media/${mediaId}`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ alt_text: nextAlt, caption: nextCaption, credit: nextCredit }),
            });
            setBanner(`Updated metadata for ${updated.media?.original_name || 'media item'}.`, 'success');
            await loadMediaLibrary(mediaPage, mediaSearchInput.value.trim());
          } catch (error) {
            setBanner(error.message || 'Unable to update media metadata.', 'error');
          }
          return;
        }
      }

      const button = event.target.closest('[data-action]');
      if (!button) return;
      const action = button.dataset.action;
      const id = button.dataset.id;

      try {
        if (action === 'edit') {
          const story = await fetchJson(`/api/stories/${id}`);
          const row = story.story || story;
          if (!row) throw new Error('Story not found for editing.');
          populateStoryForm(row);
          setBanner(`Editing ${row.title || 'story'} in the newsroom form.`, 'info');
          return;
        }

        if (action === 'begin-review') {
          const message = window.prompt('Add a short review note before moving this story into editorial review.', 'Reviewing the article for publication readiness.');
          const response = await fetchJson(`/api/editorial/stories/${id}/review`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: 'in_review', notes: message || 'Review started by editor.' }),
          });
          setBanner(`Review started for ${response.story?.title || 'story'}.`, 'success');
        } else if (action === 'request-changes') {
          const notes = window.prompt('Share clear editorial feedback for the writer:', 'Please tighten the headline, confirm the key facts, and resubmit the story with the revisions noted.');
          if (!notes) return;
          const response = await fetchJson(`/api/editorial/stories/${id}/request-changes`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ notes }),
          });
          setBanner(`Changes requested for ${response.story?.title || 'story'}.`, 'success');
        } else if (action === 'approve') {
          const notes = window.prompt('Approval note (optional):', 'Approved after editorial review.');
          const response = await fetchJson(`/api/editorial/stories/${id}/approve`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ notes: notes || 'Approved after editorial review.' }),
          });
          setBanner(`Article approved: ${response.story?.title || 'story'}.`, 'success');
        } else if (action === 'schedule') {
          const scheduledAt = window.prompt('Schedule publication date and time (ISO, for example 2026-10-05T12:00:00Z):', new Date(Date.now() + 86400000).toISOString());
          if (!scheduledAt) return;
          const response = await fetchJson(`/api/editorial/stories/${id}/schedule`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ scheduled_at: scheduledAt }),
          });
          setBanner(`Article scheduled: ${response.story?.title || 'story'} for ${formatZuluDate(response.story?.scheduled_at || scheduledAt)}.`, 'success');
        } else if (action === 'publish') {
          const confirmed = window.confirm('Publish this story now?');
          if (!confirmed) return;
          const response = await fetchJson(`/api/editorial/stories/${id}/publish`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: 'published' }),
          });
          setBanner(`Article published: ${response.story?.title || 'story'}.`, 'success');
        } else if (action === 'archive') {
          const reason = window.prompt('Archive reason (optional):', 'Archived from newsroom dashboard.');
          if (reason === null) return;
          const response = await fetchJson(`/api/editorial/stories/${id}/archive`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ reason: reason || 'Archived from newsroom dashboard.' }),
          });
          setBanner(`Article archived: ${response.story?.title || 'story'}.`, 'success');
        } else if (action === 'submit') {
          const response = await fetchJson(`/api/stories/${id}/submit`, { method: 'POST' });
          setBanner(`Submitted ${response.story?.title || 'story'} for review.`, 'success');
        } else if (action === 'toggle-breaking') {
          const enabled = button.dataset.breaking === '1';
          const response = await fetchJson(`/api/editorial/stories/${id}/breaking`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ is_breaking: enabled }),
          });
          setBanner(`${enabled ? 'Breaking' : 'Breaking flag removed'} for ${response.story?.title || 'story'}.`, 'success');
        } else if (action === 'toggle-featured') {
          const enabled = button.dataset.featured === '1';
          const response = await fetchJson(`/api/editorial/stories/${id}/feature`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ featured: enabled }),
          });
          setBanner(`${enabled ? 'Featured' : 'Featured flag removed'} for ${response.story?.title || 'story'}.`, 'success');
        }

        await loadDashboard();
      } catch (error) {
        setBanner(error.message || 'Dashboard action failed.', 'error');
      }
    });

    logoutButton.addEventListener('click', handleLogout);

    if (!token) {
      displayAuthRequired();
    } else {
      fetch('/api/auth/me', { headers: { Authorization: `Bearer ${token}` } })
        .then(async (response) => {
          if (!response.ok) {
            throw new Error('Your session is no longer valid');
          }
          const userPayload = await response.json();
          currentRole = userPayload.user?.role || currentRole;
          currentUserId = userPayload.user?.id || null;
          localStorage.setItem('currentRole', currentRole);
          localStorage.setItem('currentUser', userPayload.user?.username || storedUser || 'User');
          buildNav(currentRole);
          welcome.textContent = `Logged in as ${escapeHtml(userPayload.user?.username || storedUser || 'User')} (${escapeHtml(currentRole)})`;
          setBanner('Newsroom dashboard ready.', 'info');
          await loadDashboard();
          await loadMediaLibrary(mediaPage, mediaSearchInput.value.trim());
        })
        .catch((error) => {
          setBanner(error.message || 'Your session could not be validated.', 'error');
          displayAuthRequired();
        });
    }
  </script>
  <div id="cookie-consent-root"></div>
  <script src="/cookie-consent.js" defer></script>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      if (window.CookieConsent) window.CookieConsent.init({ companyName: 'Mpumalanga Local Time', policyUrl: '/privacy-policy.html' });
    });
  </script>
  <div style="margin-top:28px"><!--#include virtual="/footer.html"--></div>
</body>
</html>
